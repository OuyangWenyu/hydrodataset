# Hydrodataset dataset registry.
# Maps dataset id -> reader alias + relative path.
# Format: datasets.<id>.reader (str), datasets.<id>.path (relative str)
#
# This is the authoritative registry for hydrodataset-served datasets.
# hydromodel merges this registry for its own resolution.
#
# Rules (from hydromodel ADR 0001):
# - path must be relative (no absolute, no URI, no .. traversal)
# - reader must name a registered alias in data_resolver.READER_ALIASES

datasets:
  # === CAMELS Series (17 datasets) ===
  camels_us:
    reader: camels_us
    path: .

  camels_aus:
    reader: camels_aus
    path: .

  camels_br:
    reader: camels_br
    path: camels_br

